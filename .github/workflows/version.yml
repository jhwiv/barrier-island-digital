name: Stamp version.json on push

# Why: writes the current commit SHA into version.json so the inline
# auto-update script in index.html can detect new deploys and refresh
# open tabs automatically. No client ever has to hard-refresh.

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: version-stamp
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write version.json
        run: |
          SHA="${GITHUB_SHA}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "{\"sha\":\"${SHA}\",\"builtAt\":\"${BUILT_AT}\"}" > version.json
          cat version.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet version.json; then
            echo "version.json unchanged — skipping commit"
            exit 0
          fi
          git add version.json
          git commit -m "chore: stamp version.json [skip ci]"
          git push
