<svg viewBox="-8 0 146 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Barrier Island Digital compass mark">
  <!-- Outer compass ring -->
  <circle cx="65" cy="58" r="42" fill="none" stroke="currentColor" stroke-width="5"/>
  <!-- Cardinal ticks -->
  <g stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
    <line x1="65" y1="12" x2="65" y2="21"/>
    <line x1="65" y1="95" x2="65" y2="104"/>
    <line x1="19" y1="58" x2="28" y2="58"/>
    <line x1="102" y1="58" x2="111" y2="58"/>
  </g>
  <!-- 8-point compass star, faceted -->
  <g fill="currentColor">
    <!-- N (top, long) -->
    <polygon points="65,20 69,54 65,58 61,54"/>
    <polygon points="65,20 65,58 61,54" opacity="0.6"/>
    <!-- S (bottom, long) -->
    <polygon points="65,96 69,62 65,58 61,62"/>
    <polygon points="65,96 65,58 69,62" opacity="0.6"/>
    <!-- E (right) -->
    <polygon points="103,58 69,62 65,58 69,54"/>
    <polygon points="103,58 69,54 65,58" opacity="0.6"/>
    <!-- W (left) -->
    <polygon points="27,58 61,54 65,58 61,62"/>
    <polygon points="27,58 61,62 65,58" opacity="0.6"/>
    <!-- diagonals (short) -->
    <polygon points="40,33 63,56 60,58 58,55"/>
    <polygon points="90,33 67,56 70,58 72,55" opacity="0.55"/>
    <polygon points="40,83 63,60 60,58 58,61" opacity="0.55"/>
    <polygon points="90,83 67,60 70,58 72,61"/>
  </g>
  <!-- center hub -->
  <circle cx="65" cy="58" r="6.5" fill="none" stroke="currentColor" stroke-width="4"/>
  <circle cx="65" cy="58" r="2.6" fill="currentColor"/>
  <!-- Cardinal labels -->
  <g fill="currentColor" font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
    <text x="65" y="11" font-size="12">N</text>
    <text x="65" y="114" font-size="12">S</text>
    <text x="118" y="62.5" font-size="12">E</text>
    <text x="12" y="62.5" font-size="12">W</text>
  </g>
  <!-- Waves -->
  <g stroke="currentColor" fill="none" stroke-width="4.2" stroke-linecap="round">
    <path d="M22 108 C35 99, 47 117, 60 108 S86 99, 99 108 S121 116, 128 108" opacity="0.92"/>
    <path d="M28 123 C41 114, 53 132, 66 123 S92 114, 105 123" opacity="0.55"/>
  </g>
</svg>
