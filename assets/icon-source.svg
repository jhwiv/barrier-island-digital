<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Barrier Island Digital app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22324f"/>
      <stop offset="0.55" stop-color="#1c2840"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#3f7d86" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3f7d86" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background (iOS rounds the corners automatically) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Compass mark, centered, bold enough for small sizes -->
  <g transform="translate(256,236) scale(2.55)" stroke-linecap="round">
    <!-- outer ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#eaf1f2" stroke-width="6"/>
    <!-- cardinal ticks -->
    <g stroke="#eaf1f2" stroke-width="4.4">
      <line x1="0" y1="-50" x2="0" y2="-58"/>
      <line x1="0" y1="50" x2="0" y2="58"/>
      <line x1="-50" y1="0" x2="-58" y2="0"/>
      <line x1="50" y1="0" x2="58" y2="0"/>
    </g>
    <!-- 8-point faceted star -->
    <g fill="#eaf1f2">
      <polygon points="0,-38 4,-4 0,0 -4,-4"/>
      <polygon points="0,-38 0,0 -4,-4" fill="#9fc4ca"/>
      <polygon points="0,38 4,4 0,0 -4,4"/>
      <polygon points="0,38 0,0 4,4" fill="#9fc4ca"/>
      <polygon points="38,0 4,4 0,0 4,-4"/>
      <polygon points="38,0 4,-4 0,0" fill="#9fc4ca"/>
      <polygon points="-38,0 -4,-4 0,0 -4,4"/>
      <polygon points="-38,0 -4,4 0,0" fill="#9fc4ca"/>
      <polygon points="-25,-25 -2,-2 -4,0 -6,-3"/>
      <polygon points="25,-25 2,-2 4,0 6,-3" fill="#7fb0b8"/>
      <polygon points="-25,25 -2,2 -4,0 -6,3" fill="#7fb0b8"/>
      <polygon points="25,25 2,2 4,0 6,3"/>
    </g>
    <!-- center hub -->
    <circle cx="0" cy="0" r="7" fill="none" stroke="#eaf1f2" stroke-width="5"/>
    <circle cx="0" cy="0" r="3" fill="#3f7d86"/>
  </g>

  <!-- waves anchored toward the lower third -->
  <g stroke="#3f7d86" fill="none" stroke-width="11" stroke-linecap="round" transform="translate(0,18)">
    <path d="M120 392 C160 366, 196 418, 232 392 S304 366, 340 392 S408 414, 412 392" opacity="0.95"/>
    <path d="M150 430 C190 404, 226 456, 262 430 S334 404, 370 430" opacity="0.55"/>
  </g>
</svg>
